    <!-- ==============================================================
         CONTINUE READING
         ============================================================== -->

    <script>

        /*
        ==============================================================
        Continue Reading Card

        Card ini otomatis mengambil chapter berikutnya
        dari config.js.

        Jadi Chapter 1 otomatis menunjuk Chapter 2,
        Chapter 2 menunjuk Chapter 3, dst.

        Chapter terakhir mendapatkan state khusus.
        ==============================================================
        */


        function createContinueReading(){

            const container =
                document.querySelector(
                    "#continueReading"
                );


            if(!container){

                return;

            }


            const currentPage =
                window.location.pathname
                    .split("/")
                    .pop();


            const currentIndex =
                readerConfig.chapters.findIndex(
                    function(chapter){

                        return (
                            chapter.url ===
                            currentPage
                        );

                    }
                );


            const nextChapter =
                readerConfig.chapters[
                    currentIndex + 1
                ];


            /* ======================================================
               LATEST CHAPTER
               ====================================================== */

            if(!nextChapter){

                container.innerHTML = `

                    <div class="continue-card latest">

                        <div class="continue-content">

                            <p class="continue-label">
                                You have reached the latest chapter
                            </p>

                            <h2 class="continue-title">
                                Stay Tuned for The Next Dawn
                            </h2>

                        </div>

                    </div>

                `;

                return;

            }


            /* ======================================================
               NEXT CHAPTER
               ====================================================== */

            container.innerHTML = `

                <a
                    href="${nextChapter.url}"
                    class="continue-card">


                    <img
                        src="../${nextChapter.thumbnail}"
                        alt=""
                        class="continue-thumbnail">


                    <div
                        class="continue-content">


                        <p class="continue-label">
                            Continue reading the next chapter
                        </p>


                        <h2 class="continue-title">
                            ${nextChapter.title}
                        </h2>


                    </div>

                    <span class="continue-arrow"
                    aria-hidden="true">

                    </span>


                </a>

            `;

        }


        document.addEventListener(
            "DOMContentLoaded",
            createContinueReading
        );

    </script>
