<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bloodveil Dawn</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    background:#111;
    color:white;

    font-family:Arial, sans-serif;

}

.container{

    width:90%;
    max-width:1080px;

    margin:60px auto;

    display:flex;

    align-items:flex-start;

    gap:50px;

}

.left{

    width:50%;

}

.left img{

    width:100%;

    display:block;

    border-radius:15px;

}

.right{

    width:50%;

}

h1{

    font-size:60px;

    margin-bottom:10px;

}

.genres{

    font-size:25px;

    margin-bottom:30px;

}

.desc{

    font-size:27px;

    line-height:1.5;

}

.label{

    display:inline-block;

    width:130px;

    font-weight:bold;

}

button{

    margin-top:40px;

    padding:15px 40px;

    font-size:28px;

    border:none;

    border-radius:15px;

    cursor:pointer;

}


/* ===========================
   MOBILE
=========================== */

@media (max-width:768px){

    .container{

        width:95%;

        gap:20px;

        margin:20px auto;

    }

    h1{

        font-size:26px;

    }

    .genres{

        font-size:14px;

        margin-bottom:15px;

    }

    .desc{

        font-size:13px;

    }

    .label{

        width:70px;

    }

    button{

        width:100%;

        font-size:16px;

        padding:12px;

        margin-top:25px;

    }

}

</style>

</head>

<body>

<div class="container">

<div class="left">

<img src="https://res.cloudinary.com/q8roiivw/image/upload/154.jpg">

</div>

<div class="right">

<h1>Bloodveil Dawn</h1>

<p class="genres">

Fantasy • Action • Drama

</p>

<p class="desc">

<span class="label">Type</span>: Series<br>

<span class="label">Status</span>: Ongoing<br>

<span class="label">Genres</span>: Fantasy, Action, Drama<br>

<span class="label">Author</span>: Scinister

</p>

<button>

READ FIRST CHAPTER

</button>

</div>

</div>

</body>

</html>
