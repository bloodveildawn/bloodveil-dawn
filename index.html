<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bloodveil Dawn</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    background:#111;
    color:white;
    font-family:Arial, sans-serif;

}

/* ===========================
   PAGE
=========================== */

.container{

    width:90%;
    max-width:1080px;

    margin:60px auto;

    display:flex;

    gap:50px;

    align-items:stretch;

}

/* ===========================
   LEFT
=========================== */

.left{

    width:50%;

}

.left img{

    width:100%;

    aspect-ratio:3 / 4;

    object-fit:cover;

    display:block;

    border-radius:15px;

}

/* ===========================
   RIGHT
=========================== */

.right{

    width:50%;

    display:flex;

    flex-direction:column;

}

.top{

}

.bottom{

    margin-top:auto;

    display:flex;

    flex-direction:column;

    gap:15px;

}

h1{

    font-size:60px;

    margin-bottom:8px;

}

.genres{

    font-size:25px;

    margin-bottom:25px;

}

.info{

    margin-bottom:30px;

}

.info p{

    font-size:27px;

    line-height:1.6;

}

.label{

    display:inline-block;

    width:130px;

    font-weight:bold;

}

button{

    padding:18px;

    font-size:26px;

    border:none;

    border-radius:15px;

    cursor:pointer;

}

/* ===========================
   MOBILE
=========================== */

@media (max-width:768px){

.container{

    width:95%;

    margin:20px auto;

    gap:18px;

}

h1{

    font-size:34px;

}

.genres{

    font-size:18px;

    margin-bottom:18px;

}

.info{

    margin-bottom:20px;

}

.info p{

    font-size:16px;

}

.label{

    width:80px;

}

button{

    padding:12px;

    font-size:17px;

}

}

</style>

</head>

<body>

<div class="container">

<div class="left">

<img src="https://res.cloudinary.com/q8roiivw/image/upload/154.jpg">

</div>

<div class="right">

<div class="top">

<h1>Bloodveil Dawn</h1>

<p class="genres">
Fantasy • Action • Drama
</p>

<div class="info">

<p><span class="label">Type</span>Series</p>

<p><span class="label">Status</span>Ongoing</p>

<p><span class="label">Genres</span>Fantasy, Action, Drama</p>

<p><span class="label">Author</span>Scinister</p>

</div>

</div>

<div class="bottom">

<button>
READ FIRST CHAPTER
</button>

<button>
READ LATEST CHAPTER
</button>

<button>
SUPPORT THE AUTHOR
</button>

</div>

</div>

</div>

</body>

</html>
