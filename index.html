<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bloodveil Dawn</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    background:#111;
    color:white;
    font-family:Arial, sans-serif;

    overflow-x:hidden;

}

/* =========================
   CANVAS
========================= */

#app{

    width:1200px;

    transform-origin:top left;

}

/* =========================
   CONTENT
========================= */

.container{

    width:1080px;

    margin:60px auto;

    display:flex;

    gap:40px;

}

/* =========================
   LEFT
========================= */

.left{

    width:50%;

}

.left img{

    width:100%;

    display:block;

    border-radius:15px;

}

/* =========================
   RIGHT
========================= */

.right{

    width:50%;

    padding:20px;

}

.right h1{

    font-size:60px;

    margin-bottom:5px;

}

.genres{

    font-size:25px;

    margin-bottom:30px;

}

.desc{

    font-size:27px;

    line-height:1.5;

}

.label{

    display:inline-block;

    width:130px;

    font-weight:bold;

}

button{

    margin-top:40px;

    padding:15px 40px;

    font-size:28px;

    border:none;

    border-radius:15px;

    cursor:pointer;

}

</style>

</head>

<body>

<div id="app">

<div class="container">

<div class="left">

<img src="https://res.cloudinary.com/q8roiivw/image/upload/154.jpg">

</div>

<div class="right">

<h1>Bloodveil Dawn</h1>

<p class="genres">

Fantasy • Action • Drama

</p>

<p class="desc">

<span class="label">Type</span>: Series<br>

<span class="label">Status</span>: Ongoing<br>

<span class="label">Genres</span>: Fantasy, Action, Drama<br>

<span class="label">Author</span>: Scinister

</p>

<button>READ FIRST CHAPTER</button>

</div>

</div>

</div>

<script>

const DESIGN_WIDTH = 1200;

function updateScale(){

    const app = document.getElementById("app");

    const scale = Math.min(window.innerWidth / DESIGN_WIDTH,1);

    app.style.transform = `scale(${scale})`;

    document.body.style.height = (app.offsetHeight * scale) + "px";

}

window.addEventListener("resize",updateScale);

updateScale();

</script>

</body>

</html>
